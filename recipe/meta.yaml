{% set name = "plotille" %}
{% set version = "6.0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/plotille-{{ version }}.tar.gz
  sha256: 26d2cef5d4feb8632c9710442ad49fc57f9d5b20881c21ac7954c76208b5600b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7,<4.0
    - poetry-core
    - pip
  run:
    - python >=3.7.0,<4.0.0

test:
  imports:
    - plotille
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/tammoippen/plotille
  summary: Plot in the terminal using braille dots.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Satarupa22-SD
